# Runs the test suite on every pull request and on master (ADR-0004).
name: tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: System libraries for PyGObject, GTK and cloud-providers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgirepository-2.0-dev libcairo2-dev pkg-config \
            gir1.2-gtk-3.0 gir1.2-cloudproviders-0.3.0 xvfb

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: xvfb-run -a pytest --cov=syncopath --cov-report=term
